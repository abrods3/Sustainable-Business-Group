<!DOCTYPE html>
<!--
  ============================================================================
  CONTACT PAGE  (contact.html)
  Sections: Page header, Contact details and form

  ABOUT THE FORM
    Right now the form opens the visitor's own email app with the message
    filled in (a "mailto" form). To collect messages online instead, sign up
    for a form service such as Formspree, then change the <form> tag to:
      <form class="form" action="https://formspree.io/f/YOUR-ID" method="POST">
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Emory Sustainable Business Group</title>
  <meta name="description" content="Contact the Emory Sustainable Business Group about client projects, speaking at an event, or joining." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body data-page="contact">
  <main>

    <!-- ===== SECTION: PAGE HEADER ===== -->
    <section class="page-header">
      <div class="container">
        <h1>Contact Us</h1>
        <p>Get in touch about a client project, speaking at one of our events, or joining SBG.</p>
      </div>
    </section>
    <!-- ===== END SECTION: PAGE HEADER ===== -->


    <!-- ===== SECTION: CONTACT ===== -->
    <section class="section">
      <div class="container split">

        <!-- Contact details -->
        <div class="reveal">
          <h2>Reach us directly</h2>

          <div class="contact-item">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>
            <div>
              <a href="mailto:niels.cohen@emory.edu">niels.cohen@emory.edu</a><br>
              <a href="mailto:tamryn.weiss@emory.edu">tamryn.weiss@emory.edu</a>
            </div>
          </div>
          <div class="contact-item">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>
            </div>
            <a href="https://www.instagram.com/emorysbg/" target="_blank" rel="noopener">@emorysbg</a>
          </div>
          <div class="contact-item">
            <div class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            </div>
            <span>Emory University, Atlanta, GA</span>
          </div>
        </div>

        <!-- Contact form (see the note at the top of this file) -->
        <form class="form reveal" action="mailto:niels.cohen@emory.edu,tamryn.weiss@emory.edu" method="GET">
          <div class="form-row">
            <div>
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required />
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>
          </div>
          <div>
            <label for="subject">Topic</label>
            <select id="subject" name="subject">
              <option>Client project</option>
              <option>Joining SBG</option>
              <option>Speaking at an event</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="body">Message</label>
            <textarea id="body" name="body" required></textarea>
          </div>
          <div>
            <button type="submit" class="btn btn--primary">Send</button>
          </div>
        </form>

      </div>
    </section>
    <!-- ===== END SECTION: CONTACT ===== -->

  </main>

  <script src="assets/js/site.js"></script>
</body>
</html>
